<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACLS 討論投影片 - 40Test</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --accent: #4f8cff;
    --text: #e8e9ec;
    --muted: #9aa1ac;
    --border: #262b35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  header {
    padding: 24px 32px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(15,17,21,0.92);
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.4rem;
    font-weight: 600;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .controls {
    margin-top: 12px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .controls input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    width: 200px;
  }
  .controls button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }

  main {
    padding: 24px 32px 64px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
  .card img {
    width: 100%;
    display: block;
    aspect-ratio: 16/9;
    object-fit: contain;
    background: #000;
  }
  .card .label {
    padding: 8px 10px;
    font-size: 0.85rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }
  .card .label span.num {
    color: var(--text);
    font-weight: 600;
  }

  /* Lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 78vh;
    object-fit: contain;
    border-radius: 6px;
  }
  .lightbox .caption {
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .lightbox .nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.08);
    border: none;
    color: #fff;
    font-size: 1.8rem;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox .nav:hover { background: rgba(255,255,255,0.2); }
  .lightbox .nav.prev { left: 20px; }
  .lightbox .nav.next { right: 20px; }
  .lightbox .close {
    position: absolute;
    top: 20px;
    right: 24px;
    background: none;
    border: none;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    line-height: 1;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>ACLS 討論投影片 — 40Test</h1>
  <div class="subtitle">2025ACLSTeaching / 20260725ACLSDiscussion / 40Test（共 52 張）</div>
  <div class="controls">
    <input type="text" id="jumpInput" placeholder="輸入投影片編號 (1-52)">
    <button onclick="jumpTo()">跳轉</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="lightbox" id="lightbox">
  <button class="close" onclick="closeLightbox()">&times;</button>
  <button class="nav prev" onclick="navigate(-1)">&#8249;</button>
  <img id="lightboxImg" src="" alt="">
  <div class="caption" id="lightboxCaption"></div>
  <button class="nav next" onclick="navigate(1)">&#8250;</button>
</div>

<script>
  const TOTAL = 52;
  const BASE = "https://raw.githubusercontent.com/cgmherlink-hub/2025ACLSTeaching/main/20260725ACLSDiscussion/40Test/";

  function urlFor(n) {
    return BASE + encodeURIComponent("投影片" + n + ".jpeg");
  }

  const grid = document.getElementById('grid');
  for (let i = 1; i <= TOTAL; i++) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;
    card.onclick = () => openLightbox(i);
    card.innerHTML = `
      <img src="${urlFor(i)}" alt="投影片${i}" loading="lazy">
      <div class="label"><span class="num">投影片 ${i}</span><span>JPG</span></div>
    `;
    grid.appendChild(card);
  }

  let current = 1;
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxCaption = document.getElementById('lightboxCaption');

  function openLightbox(n) {
    current = n;
    updateLightbox();
    lightbox.classList.add('open');
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
  }
  function updateLightbox() {
    lightboxImg.src = urlFor(current);
    lightboxCaption.textContent = `投影片 ${current} / ${TOTAL}`;
  }
  function navigate(delta) {
    current += delta;
    if (current < 1) current = TOTAL;
    if (current > TOTAL) current = 1;
    updateLightbox();
  }
  function jumpTo() {
    const val = parseInt(document.getElementById('jumpInput').value, 10);
    if (val >= 1 && val <= TOTAL) {
      openLightbox(val);
    }
  }

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'ArrowRight') navigate(1);
    if (e.key === 'ArrowLeft') navigate(-1);
    if (e.key === 'Escape') closeLightbox();
  });
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
</script>

</body>
</html>
